name: "Validate"

on:
  workflow_dispatch:
  schedule:
    - cron:  "0 0 * * *"
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  tests:
    name: "Unit tests and formatting"
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q tests
      - run: >-
          python -m black --check tests
          custom_components/tgtg/__init__.py custom_components/tgtg/const.py
          custom_components/tgtg/captcha.py custom_components/tgtg/coordinator.py
          custom_components/tgtg/config_flow.py

  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: "Hassfest Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7.0.1"

        - name: "Run hassfest validation"
          uses: "home-assistant/actions/hassfest@master"

  hacs: # https://github.com/hacs/action
    name: "HACS Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7.0.1"

        - name: "Run HACS validation"
          uses: "hacs/action@main"
          with:
            category: "integration"
